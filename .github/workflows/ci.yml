name: GateShield CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- C++ Rate Limiter Tests ----
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libhiredis-dev libboost-all-dev

      - name: Build and run C++ tests
        working-directory: rate-limiter
        run: |
          mkdir build && cd build
          cmake -DBUILD_TESTS=ON ..
          make -j$(nproc)
          ctest --output-on-failure

  # ---- Gateway Unit Tests ----
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install and test
        working-directory: gateway
        run: |
          npm ci
          npm test

  # ---- Backend Service Verification ----
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and verify backend
        working-directory: backend
        run: |
          npm install
          node --check src/index.js

  # ---- Dashboard Build ----
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  # ---- Docker Build & Integration Tests ----
  integration:
    runs-on: ubuntu-latest
    needs: [cpp-tests, gateway-tests, backend-verify, dashboard-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for runner probes
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build all Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Health check
        run: |
          curl -sf http://localhost:3000/health | jq .
          echo "Gateway is healthy"

      - name: Test API key authentication
        run: |
          # Valid key should return 200 or 429
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: test-key-alpha" http://localhost:3000/api/products)
          echo "Valid key response: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "429" ]

          # Missing key should return 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products)
          echo "Missing key response: $STATUS"
          [ "$STATUS" = "401" ]

          # Invalid key should return 403
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: invalid-key" http://localhost:3000/api/products)
          echo "Invalid key response: $STATUS"
          [ "$STATUS" = "403" ]

      - name: Test admin login
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:3000/admin/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' | jq -r .token)
          echo "Admin login successful, token received"
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]

          # Use token to fetch stats
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:3000/admin/stats | jq .

          # Fetch services
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:3000/admin/services | jq .

      - name: Test rate limiting
        run: |
          RATE_LIMITED=0
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: test-key-alpha" http://localhost:3000/api/products)
            [ "$STATUS" = "429" ] && RATE_LIMITED=1 && break
          done
          echo "Rate limiting enforced: $RATE_LIMITED"

      - name: Run load test
        run: |
          node scripts/load-test.js --requests 30 --concurrent 5 --url http://localhost:3000

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
