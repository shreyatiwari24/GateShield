# =============================================================================
# GateShield - Production Docker Compose Deployment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Production Security Characteristics:
#   - Database (Postgres), In-Memory Cache (Redis), and C++ Rate Limiter
#     do NOT expose host ports; communication is restricted to the internal network.
#   - Memory and CPU resource constraints enforced on all containers.
#   - Persistent named volumes for Redis and PostgreSQL.
#   - Mandatory environment variables validated.
# =============================================================================

services:

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: gateshield-jaeger-prod
    networks:
      - gateshield-internal
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: gateshield-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    networks:
      - gateshield-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: gateshield-postgres-prod
    environment:
      POSTGRES_USER: ${PG_USER:-gateshield}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Database password required}
      POSTGRES_DB: ${PG_DATABASE:-gateshield}
    volumes:
      - pg-prod-data:/var/lib/postgresql/data
      - ./gateway/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - gateshield-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gateshield}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  rate-limiter:
    build:
      context: ./rate-limiter
      dockerfile: Dockerfile
    container_name: gateshield-rate-limiter-prod
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMITER_PORT: 8081
    networks:
      - gateshield-internal
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gateshield-backend-prod
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
    networks:
      - gateshield-internal
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateshield-gateway-prod
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      RATE_LIMITER_URL: http://rate-limiter:8081
      BACKEND_URL: http://backend:4000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-gateshield}
      PG_PASSWORD: ${PG_PASSWORD:?Database password required}
      PG_DATABASE: ${PG_DATABASE:-gateshield}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OTEL_SERVICE_NAME: gateshield-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_LOG_LEVEL: info
      OTEL_METRICS_EXPORTER: none
    networks:
      - gateshield-internal
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      rate-limiter:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: gateshield-dashboard-prod
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    networks:
      - gateshield-internal
    depends_on:
      gateway:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  gateshield-internal:
    driver: bridge

volumes:
  redis-prod-data:
  pg-prod-data:
