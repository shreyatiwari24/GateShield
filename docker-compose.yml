# version: '3.8'

services:

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: gateshield-jaeger
    ports:
      - "16686:16686"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gateshield-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: gateshield-postgres
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-gateshield}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gateshield_dev}
      POSTGRES_DB: ${PG_DATABASE:-gateshield}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./gateway/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gateshield}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  rate-limiter:
    build:
      context: ./rate-limiter
      dockerfile: Dockerfile
    container_name: gateshield-rate-limiter
    ports:
      - "${RATE_LIMITER_PORT:-8081}:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMITER_PORT: 8081
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateshield-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      RATE_LIMITER_URL: http://rate-limiter:8081
      BACKEND_URL: http://backend:4000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-gateshield}
      PG_PASSWORD: ${PG_PASSWORD:-gateshield_dev}
      PG_DATABASE: ${PG_DATABASE:-gateshield}
      JWT_SECRET: ${JWT_SECRET:-gateshield-change-me-in-production}
      OTEL_SERVICE_NAME: gateshield-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_LOG_LEVEL: info
      OTEL_METRICS_EXPORTER: none

    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      rate-limiter:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gateshield-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: gateshield-dashboard
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  redis-data:
  pg-data:
